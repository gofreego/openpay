syntax = "proto3";
package v1;

option go_package = "./openpay_v1";

import "proto/openpay/v1/product.proto";

// GetMe tells the admin console who the operator is, what they may do, and
// on which products — resolved by the server exactly as it resolves them for
// every other call. The console uses it to shape navigation; the server
// still checks every request, so hiding a button is never the boundary.
message GetMeRequest {}

message GetMeResponse {
  string user_id = 1;
  // The operator's OpenPay permissions, as opengate forwarded them.
  repeated string permissions = 2;
  // True for central ops (openpay:scope:all): every product, plus the
  // platform-level screens.
  bool scope_all = 3;
  // The products this operator may see: every product for central ops,
  // otherwise those their scope grants that exist.
  repeated Product products = 4;
}
