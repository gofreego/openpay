syntax = "proto3";
package v1;

option go_package = "./openpay_v1";

import "validate/validate.proto";
import "google/protobuf/timestamp.proto";

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_REVOKED = 2;
}

// ServiceCredential is how a product's backend authenticates. It never carries
// the secret: that exists only in the response to CreateServiceCredential.
message ServiceCredential {
  string id = 1;
  string product_id = 2;
  string name = 3;
  // The public half, safe to display and to log.
  string key_id = 4;
  CredentialStatus status = 5;
  // Answers "is anyone still using this key?" before revoking it.
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateServiceCredentialRequest {
  string product_id = 1 [(validate.rules).string = {min_len: 1}];
  string name = 2 [(validate.rules).string = {min_len: 1, max_len: 100}];
}

message CreateServiceCredentialResponse {
  ServiceCredential credential = 1;

  // The secret, in clear text, returned exactly once. It is stored only as a
  // hash, so it cannot be recovered later — if it is lost, issue a new
  // credential and revoke this one.
  //
  // Present the credential to OpenPay as: Authorization: Bearer <key_id>.<secret>
  string secret = 2;
}

message ListServiceCredentialsRequest {
  string product_id = 1 [(validate.rules).string = {min_len: 1}];
}

message ListServiceCredentialsResponse {
  repeated ServiceCredential credentials = 1;
}

message RevokeServiceCredentialRequest {
  string id = 1 [(validate.rules).string = {min_len: 1}];
}

message RevokeServiceCredentialResponse {
  ServiceCredential credential = 1;
}
