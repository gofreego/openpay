syntax = "proto3";
package v1;

option go_package = "./openpay_v1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "proto/openpay/v1/ping.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "OpenPay API"
    version: "v1.0.0"
    description: "OpenPay is a opensource payment service"
  }
  tags: [
    {
      name: "Ping"
      description: "Health check endpoints"
    }
  ]
  security_definitions: {
    security: {
      key: "UserId"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "x-user-id"
        description: "ID of the authenticated user"
      }
    }
    security: {
      key: "UserPerms"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "x-user-perms"
        description: "Comma-separated permissions of the authenticated user"
      }
    }
  }
  security: {
    security_requirement: {
      key: "UserId"
      value: {}
    }
    security_requirement: {
      key: "UserPerms"
      value: {}
    }
  }
};

service OpenPay {
    
    // Ping is a simple GET request that returns a Pong message.
    rpc Ping (PingRequest) returns (PingResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/ping"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ping"
            summary: "Ping the server"
            description: "Check if the server is alive."
        };
    }
}

