syntax = "proto3";
package v1;

option go_package = "./openpay_v1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "proto/openpay/v1/product.proto";
import "proto/openpay/v1/wallet_type.proto";
import "proto/openpay/v1/customer.proto";
import "proto/openpay/v1/credential.proto";
import "proto/openpay/v1/ledger.proto";
import "proto/openpay/v1/wallet.proto";
import "proto/openpay/v1/payment.proto";
import "proto/openpay/v1/order.proto";
import "proto/openpay/v1/recon.proto";
import "proto/openpay/v1/withdrawal.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "OpenPay API"
    version: "v1.0.0"
    description: "OpenPay is a opensource payment service"
  }
  tags: [
    {
      name: "Products"
      description: "Product registration and configuration"
    },
    {
      name: "Credentials"
      description: "Service credentials a product's backend authenticates with"
    },
    {
      name: "WalletTypes"
      description: "What a balance of a given type is allowed to do"
    },
    {
      name: "Customers"
      description: "People, identified platform-wide by their OpenAuth user id"
    },
    {
      name: "Wallets"
      description: "Customer balances, each backed by one ledger account"
    },
    {
      name: "Payments"
      description: "Collecting money through payment providers"
    },
    {
      name: "Orders"
      description: "What was bought, and settling it from wallets and cards"
    },
    {
      name: "Reconciliation"
      description: "Settlements matched against the ledger, and the break queue"
    },
    {
      name: "Withdrawals"
      description: "Cashing withdrawable wallets out to a bank account or UPI id"
    },
    {
      name: "Ledger"
      description: "Read-only view of the double-entry ledger, and its invariant checks"
    }
  ]
  security_definitions: {
    security: {
      key: "UserId"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "x-user-id"
        description: "ID of the authenticated user"
      }
    }
    security: {
      key: "UserPerms"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "x-user-perms"
        description: "Comma-separated permissions of the authenticated user"
      }
    }
  }
  security: {
    security_requirement: {
      key: "UserId"
      value: {}
    }
    security_requirement: {
      key: "UserPerms"
      value: {}
    }
  }
};

// Liveness and readiness are served outside this API, at /healthz and /readyz.
// They are deliberately not RPCs: probes should not sit in the versioned,
// publicly routed surface of a payments API.
service OpenPay {

    // ---- Catalog: products ----
    // Operator-only. Products are created by central ops, not by the product
    // backends themselves.

    rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/products"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Products"
            summary: "Create a product"
            description: "Registers a product. The code is immutable once set because ledger account codes embed it. Requires the openpay:products:write permission and an Idempotency-Key header."
        };
    }

    rpc GetProduct (GetProductRequest) returns (GetProductResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/products/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Products"
            summary: "Get a product"
            description: "Requires the openpay:products:read permission."
        };
    }

    rpc ListProducts (ListProductsRequest) returns (ListProductsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/products"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Products"
            summary: "List products"
            description: "Requires the openpay:products:read permission."
        };
    }

    rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse) {
        option (google.api.http) = {
            patch: "/openpay/v1/products/{id}"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Products"
            summary: "Update a product"
            description: "Changes name and status only. Code and currency are immutable. Requires the openpay:products:write permission."
        };
    }

    // ---- Catalog: service credentials ----
    // Operator-only. The secret is returned exactly once, at creation.

    rpc CreateServiceCredential (CreateServiceCredentialRequest) returns (CreateServiceCredentialResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/credentials"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Credentials"
            summary: "Issue a service credential"
            description: "Returns the secret in clear text exactly once; it is stored only as a hash and cannot be recovered. Requires the openpay:credentials:write permission."
        };
    }

    rpc ListServiceCredentials (ListServiceCredentialsRequest) returns (ListServiceCredentialsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/credentials"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Credentials"
            summary: "List a product's service credentials"
            description: "Never returns secrets. Requires the openpay:credentials:write permission."
        };
    }

    rpc RevokeServiceCredential (RevokeServiceCredentialRequest) returns (RevokeServiceCredentialResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/credentials/{id}/revoke"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Credentials"
            summary: "Revoke a service credential"
            description: "Takes effect immediately. Revoking an already-revoked credential succeeds. Requires the openpay:credentials:write permission."
        };
    }

    // ---- Catalog: wallet types ----
    // Operator-only. A wallet type is the configuration a balance behaves by.

    rpc CreateWalletType (CreateWalletTypeRequest) returns (CreateWalletTypeResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/wallet-types"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "WalletTypes"
            summary: "Create a wallet type"
            description: "Requires the openpay:wallet_types:write permission. Enabling withdrawable additionally requires openpay:wallet_types:approve_withdrawal and an approval reference, because it moves the balance from closed-loop into prepaid-instrument territory."
        };
    }

    rpc GetWalletType (GetWalletTypeRequest) returns (GetWalletTypeResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/wallet-types/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "WalletTypes"
            summary: "Get a wallet type"
            description: "Requires the openpay:wallet_types:read permission."
        };
    }

    rpc ListWalletTypes (ListWalletTypesRequest) returns (ListWalletTypesResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/wallet-types"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "WalletTypes"
            summary: "List a product's wallet types"
            description: "Includes platform-scoped types, which are spendable in every product. Requires the openpay:wallet_types:read permission."
        };
    }

    rpc UpdateWalletType (UpdateWalletTypeRequest) returns (UpdateWalletTypeResponse) {
        option (google.api.http) = {
            patch: "/openpay/v1/wallet-types/{id}"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "WalletTypes"
            summary: "Update a wallet type"
            description: "Changes name, status and limits only. Currency, scope and every capability are immutable once the type exists, because balances are already held under those rules."
        };
    }

    // ---- Customers ----
    // A customer is a person, platform-wide, keyed by their OpenAuth user id.

    rpc UpsertCustomer (UpsertCustomerRequest) returns (UpsertCustomerResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/customers"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Customers"
            summary: "Register a customer"
            description: "Called by a product's backend with a service credential. Idempotent on external_ref, and resolves through a merge if the person's record was merged into another."
        };
    }

    rpc GetCustomer (GetCustomerRequest) returns (GetCustomerResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/customers/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Customers"
            summary: "Get a customer"
            description: "Accepts an OpenPay customer id or an OpenAuth external ref. Callable by a product backend or by an operator holding openpay:customers:read."
        };
    }

    // ---- Ledger ----
    // Operator-only and read-only: no RPC here posts a journal.

    rpc GetLedgerAccount (GetLedgerAccountRequest) returns (GetLedgerAccountResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/ledger/accounts/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ledger"
            summary: "Get a ledger account and its balance"
            description: "Accepts an account id or an account code. Requires the openpay:ledger:read permission."
        };
    }

    rpc ListLedgerAccounts (ListLedgerAccountsRequest) returns (ListLedgerAccountsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/ledger/accounts"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ledger"
            summary: "List ledger accounts with balances"
            description: "Filter by product, platform-only, type or code prefix. Requires the openpay:ledger:read permission."
        };
    }

    rpc GetAccountStatement (GetAccountStatementRequest) returns (GetAccountStatementResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/ledger/accounts/{account_id}/statement"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ledger"
            summary: "Get an account statement"
            description: "Postings newest first, each with the running balance after it. Cursor-paginated, so a page never shifts when new postings arrive. Requires the openpay:ledger:read permission."
        };
    }

    rpc GetJournal (GetJournalRequest) returns (GetJournalResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/ledger/journals/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ledger"
            summary: "Get a journal and its postings"
            description: "Accepts a journal id or its external id. Requires the openpay:ledger:read permission."
        };
    }

    rpc GetTrialBalance (GetTrialBalanceRequest) returns (GetTrialBalanceResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/ledger/trial-balance"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ledger"
            summary: "Get the trial balance"
            description: "Every account's debits, credits and balance, computed from postings, optionally as of a past moment and for one product. Platform-wide debits and credits must be equal. Requires the openpay:ledger:read permission."
        };
    }

    rpc RunLedgerCheck (RunLedgerCheckRequest) returns (RunLedgerCheckResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/ledger/checks"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ledger"
            summary: "Run the ledger invariant checks now"
            description: "Checks every invariant against one consistent snapshot and records the run. Reports drift; never fixes it. Requires the openpay:ledger:check permission. Takes no idempotency key: it moves no money, and running it twice is harmless."
        };
    }

    rpc ListLedgerCheckRuns (ListLedgerCheckRunsRequest) returns (ListLedgerCheckRunsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/ledger/checks"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Ledger"
            summary: "List recent ledger check runs"
            description: "Scheduled and manual runs, newest first. Requires the openpay:ledger:read permission."
        };
    }

    // ---- Wallets ----
    // Product backends see their own product's wallets and platform-scoped
    // ones; operators see what their product scope grants.

    rpc OpenWallet (OpenWalletRequest) returns (OpenWalletResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/wallets"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "Open a customer's wallet"
            description: "Returns the customer's wallet of a type, creating it on first reference. Product backend only. Naturally idempotent; no Idempotency-Key."
        };
    }

    rpc GetWallet (GetWalletRequest) returns (GetWalletResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/wallets/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "Get a wallet and its balance"
            description: "Product backend, or an operator holding openpay:wallets:read."
        };
    }

    rpc ListCustomerWallets (ListCustomerWalletsRequest) returns (ListCustomerWalletsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/customers/{customer_id}/wallets"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "List a customer's wallets"
            description: "A product backend sees its own product's wallets and platform-scoped ones — never another product's. An operator sees their scope; platform wallets need openpay:scope:all."
        };
    }

    rpc GetWalletStatement (GetWalletStatementRequest) returns (GetWalletStatementResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/wallets/{wallet_id}/statement"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "Get a wallet statement"
            description: "Newest first, cursor-paginated, each line with its change and running balance."
        };
    }

    rpc GrantWallet (GrantWalletRequest) returns (GrantWalletResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/wallets/{wallet_id}/grants"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "Grant promotional value"
            description: "Grantable wallet types only, funded by the product's promotions expense and reason-coded. Requires an Idempotency-Key. Product backend, or an operator holding openpay:wallets:grant."
        };
    }

    rpc TransferWallet (TransferWalletRequest) returns (TransferWalletResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/wallets/{from_wallet_id}/transfers"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "Transfer to another customer"
            description: "Between wallets of the same, transferable type. Product backend only. Requires an Idempotency-Key."
        };
    }

    rpc AdjustWallet (AdjustWalletRequest) returns (AdjustWalletResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/wallets/{wallet_id}/adjustments"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "Adjust a wallet"
            description: "Operator correction against the product's adjustments expense, reason-coded and explained. Bypasses capability and limit rules but never permits an overdraft. Requires openpay:wallets:adjust and openpay:scope:all, and an Idempotency-Key."
        };
    }

    rpc GetFloatHeld (GetFloatHeldRequest) returns (GetFloatHeldResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/float-held"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Wallets"
            summary: "Get the real customer money held"
            description: "Balances of fundable wallets only, per product, with platform-scoped wallets as their own line. Requires openpay:wallets:read; platform lines need openpay:scope:all."
        };
    }

    // ---- Payments ----

    rpc CreatePayment (CreatePaymentRequest) returns (CreatePaymentResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/payments"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "Start collecting a payment"
            description: "Product backend only. Returns the checkout to send the customer to. Requires an Idempotency-Key. Wallet top-ups only until orders exist."
        };
    }

    rpc GetPayment (GetPaymentRequest) returns (GetPaymentResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/payments/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "Get a payment"
            description: "Product backend for its own payments, or an operator holding openpay:payments:read; operators also see attempts and the transition history."
        };
    }

    rpc ListPayments (ListPaymentsRequest) returns (ListPaymentsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/payments"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "List payments"
            description: "Operator only, within scope. Requires openpay:payments:read."
        };
    }

    rpc SyncPayment (SyncPaymentRequest) returns (SyncPaymentResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/payments/{id}/sync"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "Sync a payment with its provider now"
            description: "Fetches the provider's state and applies it, as the poller would. Requires openpay:payments:sync."
        };
    }

    rpc CreateRefund (CreateRefundRequest) returns (CreateRefundResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/payments/{payment_id}/refunds"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "Refund a payment"
            description: "Returns part or all of a captured payment to its source. A wallet top-up can only be refunded while its value is still in the wallet. Central ops only: requires openpay:refunds:create and openpay:scope:all, an explained reason code, and an Idempotency-Key."
        };
    }

    rpc GetRefund (GetRefundRequest) returns (GetRefundResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/refunds/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "Get a refund"
            description: "Requires openpay:payments:read within scope."
        };
    }

    rpc ListRefunds (ListRefundsRequest) returns (ListRefundsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/payments/{payment_id}/refunds"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "List a payment's refunds"
            description: "Requires openpay:payments:read within scope."
        };
    }

    rpc GetDispute (GetDisputeRequest) returns (GetDisputeResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/disputes/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "Get a dispute"
            description: "Requires openpay:payments:read within scope."
        };
    }

    rpc ListDisputes (ListDisputesRequest) returns (ListDisputesResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/disputes"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "List disputes"
            description: "The disputes queue, nearest evidence deadline first. Requires openpay:payments:read within scope."
        };
    }

    rpc SubmitDisputeEvidence (SubmitDisputeEvidenceRequest) returns (SubmitDisputeEvidenceResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/disputes/{id}/evidence"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Payments"
            summary: "Submit evidence for a dispute"
            description: "Only while the dispute is open. Central ops only: requires openpay:disputes:manage and openpay:scope:all."
        };
    }

    // ---- Orders ----

    rpc CreateItem (CreateItemRequest) returns (CreateItemResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/items"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Orders"
            summary: "Add an item to the product's catalogue"
            description: "Product backend only. The catalogue describes; orders carry what was actually charged."
        };
    }

    rpc ListItems (ListItemsRequest) returns (ListItemsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/items"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Orders"
            summary: "List the product's catalogue"
            description: "Product backend only."
        };
    }

    rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/orders"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Orders"
            summary: "Create and pay for an order"
            description: "Product backend only. Checks the amounts add up, then settles from wallets at once, or holds the wallet shares and returns a checkout for the card share. Requires an Idempotency-Key; also idempotent on external_ref."
        };
    }

    rpc GetOrder (GetOrderRequest) returns (GetOrderResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/orders/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Orders"
            summary: "Get an order"
            description: "Product backend for its own orders, or an operator holding openpay:payments:read within scope."
        };
    }

    rpc RefundOrder (RefundOrderRequest) returns (RefundOrderResponse) {
        option (google.api.http) = {
            post: "/openpay/v1/orders/{id}/refunds"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Orders"
            summary: "Refund an order"
            description: "Returns part or all of a paid order with its own tax split, real money first: card, then purchased wallets, then granted ones. Product backend for its own orders, or central ops with openpay:refunds:create. Requires an Idempotency-Key."
        };
    }

    // ---- Reconciliation ----

    rpc ListSettlements (ListSettlementsRequest) returns (ListSettlementsResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/settlements"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Reconciliation"
            summary: "List settlements"
            description: "Newest first. Central ops: requires openpay:recon:read and openpay:scope:all."
        };
    }

    rpc GetSettlement (GetSettlementRequest) returns (GetSettlementResponse) {
        option (google.api.http) = {
            get: "/openpay/v1/settlements/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            tags: "Reconciliation"
            summary: "Get a settlement"
