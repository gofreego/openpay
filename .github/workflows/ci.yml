name: CI

# Checks every change, and publishes the Docker image — the only thing
# OpenPay ships — to ghcr.io/gofreego/openpay once the checks pass on master
# or a version tag. Pull requests build the image without pushing it.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      # Integration tests need a real Postgres: row locks, SKIP LOCKED and
      # constraints under contention are what they test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpay
          POSTGRES_PASSWORD: openpay
          POSTGRES_DB: openpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openpay -d openpay_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Stand in for the console build
        # main.go embeds ui/dist, which must exist to compile. No test needs
        # the real console (they use fstest), and only the Docker image ships,
        # which builds and embeds it for real — so a placeholder is enough
        # and this job need not wait for the console job.
        run: mkdir -p ui/dist && touch ui/dist/.gitkeep
      - name: Migrate the test database
        run: |
          go install github.com/gofreego/goutils/cmd/sql-migrator@v1.3.8
          # sql-migrator waits for a signal once done; stop it after it applies.
          sql-migrator ./migrator.test.yaml & MIG=$!; sleep 10; kill $MIG || true
      - name: Vet
        run: go vet ./...
      - name: Test
        # -p 1: packages share openpay_test and TRUNCATE it.
        run: OPENPAY_TEST_POSTGRES=1 go test -race -p 1 ./...

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [go, console]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # master → latest + sha-<commit>; tag v1.2.3 → 1.2.3 + 1.2.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build, and push unless this is a pull request
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
