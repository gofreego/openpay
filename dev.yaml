LogConfig: true
Logger:
  AppName: openpay
  Build: dev
  Level: debug
ConfigReader:
  Name: ""
  Format: ""
  Consul:
    Address: ""
    Token: ""
    Path: ""
  Zookeeper:
    Address: ""
    Path: ""
    Username: ""
    Password: ""
AppNames:
- HTTP_SERVER
- GRPC_SERVER
- WORKER
Server:
  GRPCPort: 8086
  HTTPPort: 8085
Repository:
  PostgreSQL:
    # `postgresql`, `primary` and `replica` are lowercase because those goutils
    # fields carry no yaml tags; Host/Port/etc. do, so they stay capitalised.
    postgresql:
      primary:
        Host: localhost
        Port: 5432
        Username: openpay
        Password: openpay
        DBName: openpay
        SSLMode: disable
      replica: []
Service: {}
Worker:
  Outbox:
    Interval: 5s
    BatchSize: 100
  IdempotencySweepInterval: 1h
  IdempotencySweepBatch: 1000
Telemetry:
  Enabled: true
  ServiceName: openpay
  Environment: dev
  Endpoint: localhost:4317
  Insecure: true
  # Payment volume is low, so keeping every trace is affordable and far more
  # useful when investigating one customer's failed payment.
  SampleRatio: 1.0
  MetricInterval: 15s
Debug:
  Enabled: true
  EnablePprof: true