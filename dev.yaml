LogConfig: true
Logger:
  AppName: openpay
  Build: dev
  Level: debug
ConfigReader:
  Name: ""
  Format: ""
  Consul:
    Address: ""
    Token: ""
    Path: ""
  Zookeeper:
    Address: ""
    Path: ""
    Username: ""
    Password: ""
AppNames:
- HTTP_SERVER
- GRPC_SERVER
Server:
  GRPCPort: 8086
  HTTPPort: 8085
Repository:
  PostgreSQL:
    # `postgresql`, `primary` and `replica` are lowercase because those goutils
    # fields carry no yaml tags; Host/Port/etc. do, so they stay capitalised.
    postgresql:
      primary:
        Host: localhost
        Port: 5432
        Username: openpay
        Password: openpay
        DBName: openpay
        SSLMode: disable
      replica: []
Service: {}
Debug:
  Enabled: true
  EnablePprof: true