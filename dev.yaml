LogConfig: true
Logger:
  AppName: openpay
  Build: dev
  Level: debug
ConfigReader:
  Name: ""
  Format: ""
  Consul:
    Address: ""
    Token: ""
    Path: ""
  Zookeeper:
    Address: ""
    Path: ""
    Username: ""
    Password: ""
AppNames:
- HTTP_SERVER
- GRPC_SERVER
- WORKER
Server:
  GRPCPort: 8086
  HTTPPort: 8085
  # Per service credential, per instance. Generous: this stops runaway
  # callers, it does not meter normal traffic.
  RateLimit:
    Default:
      RequestsPerSecond: 50
      Burst: 100
Repository:
  PostgreSQL:
    # `postgresql`, `primary` and `replica` are lowercase because those goutils
    # fields carry no yaml tags; Host/Port/etc. do, so they stay capitalised.
    postgresql:
      primary:
        Host: localhost
        Port: 5432
        Username: openpay
        Password: openpay
        DBName: openpay
        SSLMode: disable
        # One pool per process, shared by the HTTP, gRPC and worker apps.
        # The load test (internal/wallet/load_test.go) saturates the posting
        # engine at ~4 concurrent writers — hot accounts serialise, not the
        # pool — so 20 is ample; raising it adds queueing, not throughput.
        # Keep instances × MaxOpenConns well under Postgres max_connections.
        MaxOpenConns: 20
        MaxIdleConns: 10
        ConnMaxLifetime: 30m
        ConnMaxIdleTime: 5m
      replica: []
Service:
  # Per-person caps across every fundable wallet a customer holds, in minor
  # units. 0 = no cap. Permissive until a PPI decision (plan.md Q1) sets them.
  Wallet:
    MaxCustomerBalance: 0
    MaxCustomerDailyLoad: 0
  Payments:
    Providers: [mock]
    TTL: 30m
    # An open payment untouched this long is checked with its provider.
    PollAfter: 2m
    # Every provider call: timeout, retries on outages (safe — every mutating
    # call carries our idempotency id), and a circuit breaker.
    Resilience:
      Timeout: 10s
      Retries: 2
      Backoff: 200ms
      FailureThreshold: 5
      Cooldown: 30s
    # Local development only. The mock moves no money and its checkout page
    # lets anyone mark a payment paid.
    Mock:
      Enabled: true
      WebhookSecret: dev-mock-webhook-secret
      CheckoutURL: http://localhost:8085/openpay/v1/mock-provider/checkout/
  Recon:
    # The bank account settlements land in (a Ledger.Banks entry).
    Bank: hdfc
    # A captured payment unsettled this long is flagged missing at the provider.
    SettleWithin: 72h
  Withdrawals:
    Bank: hdfc
    # How long a newly verified destination waits before it can receive
    # money. 0 for local testing; 24h or more in production.
    BeneficiaryCooling: 0s
    # Per-person daily caps across all wallets (paise / count). 0 = none.
    MaxCustomerDailyWithdrawal: 0
    MaxCustomerDailyWithdrawals: 0
  # DEV ONLY. Production keys come from the secret store, never a committed
  # file. Rotate by adding a key and switching CurrentKeyID; old values still open.
  Encryption:
    CurrentKeyID: dev1
    Keys:
      dev1: ZGV2LW9ubHktZmllbGQta2V5LTMyLWJ5dGVzLWxuZyE=
  ReconAlerts:
    AgedAfter: 48h
    # Alert when a provider's suspense holds more than this, either way (paise).
    SuspenseThreshold: 100000
Worker:
  Outbox:
    Interval: 5s
    BatchSize: 100
  IdempotencySweepInterval: 1h
  IdempotencySweepBatch: 1000
  LedgerCheckInterval: 24h
  HoldSweepInterval: 1m
  WalletExpiryInterval: 1h
  PaymentEventInterval: 1s
  PaymentPollInterval: 1m
  ReconInterval: 1h
# Platform chart of accounts: each provider gets a receivable and a suspense
# account, each bank a current account. Adding one here creates its accounts
# the next time the worker starts; removing one never deletes anything.
Ledger:
  Providers:
  - razorpay
  - cashfree
  - mock
  Banks:
  - hdfc
Telemetry:
  Enabled: true
  ServiceName: openpay
  Environment: dev
  Endpoint: localhost:4317
  Insecure: true
  # Payment volume is low, so keeping every trace is affordable and far more
  # useful when investigating one customer's failed payment.
  SampleRatio: 1.0
  MetricInterval: 15s
Debug:
  Enabled: true
  EnablePprof: true