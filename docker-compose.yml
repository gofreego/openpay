services:
  postgres:
    image: postgres:16-alpine
    container_name: openpay-postgres
    environment:
      POSTGRES_USER: openpay
      POSTGRES_PASSWORD: openpay
      POSTGRES_DB: openpay
    ports:
      - "5432:5432"
    volumes:
      - openpay-pgdata:/var/lib/postgresql/data
      # Runs only on first initialisation of the volume. To pick up changes
      # here afterwards: docker compose down -v && docker compose up -d
      - ./resources/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpay -d openpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: openpay-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./resources/docker/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

volumes:
  openpay-pgdata:
