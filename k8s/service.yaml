apiVersion: v1
kind: Service
metadata:
  name: openpay
spec:
  selector:
    app: openpay
  ports:
    # Product backends: openpay.<namespace>.svc.cluster.local:8086.
    - name: grpc
      port: 8086
      targetPort: grpc
    # API, admin console (/payments/) and provider webhooks, via the gateway.
    - name: http
      port: 80
      targetPort: http
